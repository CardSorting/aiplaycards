app = 'pokecardmaker-net'
primary_region = 'ord'

[build]
  # Increase build resources to prevent timeouts
  [build.args]
    NEXT_PUBLIC_PAYPAL_CLIENT_ID = "AYUqilo7wsIqIIKvqbfhYGEJ6dY8MkT6zPee1BLIi69ShlmpdB93FRzhN2oD-fTqWq7NOvwnln5ms4"
    NEXT_PUBLIC_ADMIN_EMAIL = "willcruzdesigner@gmail.com"
    NEXT_PUBLIC_ADMIN_USER_ID = "f3b75fc6-2baf-4a6d-a974-ac487e1f1a98"
    NEXTAUTH_URL = "https://pokecardmaker.net"

[env]
  NEXT_PUBLIC_PAYPAL_CLIENT_ID = "AYUqilo7wsIqIIKvqbfhYGEJ6dY8MkT6zPee1BLIi69ShlmpdB93FRzhN2S2oD-fTqWq7NOvwnln5ms4"
  NEXT_PUBLIC_ADMIN_EMAIL = "willcruzdesigner@gmail.com"
  NEXT_PUBLIC_ADMIN_USER_ID = "f3b75fc6-2baf-4a6d-a974-ac487e1f1a98"
  NEXT_PUBLIC_ENVIRONMENT = "production"

# App process environment
[env.app]
  FLY_PROCESS_GROUP = "app"

# Workers process environment  
[env.workers]
  FLY_PROCESS_GROUP = "workers"
  WORKER_PORT = "3001"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[processes]
  app = "npm start"
  workers = "npm run workers:image"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['workers']

[[services]]
  protocol = 'tcp'
  internal_port = 3001
  processes = ['workers']

  [[services.ports]]
    port = 3001
    handlers = ['http']
    force_https = false
