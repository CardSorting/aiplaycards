<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lunaclasmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <pattern id="starPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.5" fill="rgba(255,255,255,0.3)"/>
    </pattern>
  </defs>
  <rect width="400" height="200" fill="url(#lunaclasmGradient)"/>
  <rect width="400" height="200" fill="url(#starPattern)"/>
  <circle cx="100" cy="80" r="20" fill="rgba(255,255,255,0.1)"/>
  <text x="200" y="100" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="24" font-weight="bold">LUNACLASM</text>
  <text x="200" y="130" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="12">COSMIC DREAMS</text>
</svg>
