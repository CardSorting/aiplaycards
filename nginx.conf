# PlayMore TCG - Nginx Configuration
# Comprehensive nginx.conf for SEO, security, and performance

server {
    listen 80;
    server_name playmoretcg.com www.playmoretcg.com;
    return 301 https://www.playmoretcg.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name playmoretcg.com;
    return 301 https://www.playmoretcg.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.playmoretcg.com;
    
    # SSL Configuration
    ssl_certificate /path/to/ssl/certificate.crt;
    ssl_certificate_key /path/to/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://gc.zgo.at; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    
    # Root directory
    root /var/www/playmoretcg/public;
    index index.html index.htm;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Cache Control for static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }
    
    # Cache Control for HTML
    location ~* \.(html|htm)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # Cache Control for API responses
    location ~* \.(json|xml)$ {
        expires 5m;
        add_header Cache-Control "public";
    }
    
    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
    }
    
    location ~* \.(bak|backup|old|orig|save|swp|tmp)$ {
        deny all;
    }
    
    location ~* \.(git|svn|hg|bzr|cvs)$ {
        deny all;
    }
    
    # Allow access to SEO files
    location = /robots.txt {
        allow all;
        add_header Content-Type text/plain;
    }
    
    location = /sitemap.xml {
        allow all;
        add_header Content-Type application/xml;
    }
    
    location = /humans.txt {
        allow all;
        add_header Content-Type text/plain;
    }
    
    location = /ads.txt {
        allow all;
        add_header Content-Type text/plain;
    }
    
    location = /app-ads.txt {
        allow all;
        add_header Content-Type text/plain;
    }
    
    location = /.well-known/security.txt {
        allow all;
        add_header Content-Type text/plain;
    }
    
    location ~ ^/api {
        deny all;
    }
    
    location ~ ^/_next {
        deny all;
    }
    
    location ~ ^/static {
        deny all;
    }
    
    # Prevent hotlinking
    location ~* \.(jpg|jpeg|png|gif|svg|ico|css|js)$ {
        valid_referers none blocked playmoretcg.com www.playmoretcg.com google.com www.google.com bing.com www.bing.com yahoo.com www.yahoo.com facebook.com www.facebook.com twitter.com www.twitter.com linkedin.com www.linkedin.com pinterest.com www.pinterest.com instagram.com www.instagram.com;
        if ($invalid_referer) {
            return 403;
        }
    }
    
    # Block bad bots
    if ($http_user_agent ~* (java|curl|wget|libwww-perl|python|nikto|scan|winhttp|HTTrack|clshttp|archiver|loader|email|harvest|extract|grab|miner)) {
        return 403;
    }
    
    # SEO-friendly redirects
    rewrite ^/home/?$ / permanent;
    rewrite ^/index\.html$ / permanent;
    rewrite ^/index\.php$ / permanent;
    
    # Remove trailing slashes
    rewrite ^/(.*)/$ /$1 permanent;
    
    # Main location block
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security headers for main content
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        internal;
        add_header Content-Type text/html;
    }
    
    location = /50x.html {
        internal;
        add_header Content-Type text/html;
    }
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    
    location ~ ^/api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location ~ ^/signin {
        limit_req zone=login burst=5 nodelay;
        try_files $uri $uri/ /index.html;
    }
    
    # Logging
    access_log /var/log/nginx/playmoretcg.access.log;
    error_log /var/log/nginx/playmoretcg.error.log;
}

# Upstream backend configuration
upstream backend {
    server 127.0.0.1:3000;
    keepalive 32;
}
